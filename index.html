<!DOCTYPE html> 
<!-- Define que el documento usa HTML5 -->

<html lang="es">
<!-- Idioma del sitio: español -->

<head>
  <meta charset="UTF-8">
  <!-- Permite usar tildes, ñ y caracteres especiales -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Hace la página adaptable a celulares -->

  <title>Tienda Online</title>
  <!-- Título que aparece en la pestaña del navegador -->

  <link rel="stylesheet" href="styles.css">
  <!-- Conecta el archivo de estilos CSS -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Librería externa para generar PDFs (factura) -->
</head>

<body>
<!-- Todo lo visible en la página empieza aquí -->

  <h1>🛒 Mi Tienda Online</h1>
  <!-- Título principal de la tienda -->

  <div class="container">
  <!-- Contenedor general que divide productos y carrito -->

    <div class="product-grid">
    <!-- Sección donde se muestran los productos -->

      <div class="product-card">
      <!-- Tarjeta de producto individual -->

        <h3>Camiseta Clásica</h3>
        <!-- Nombre del producto -->

        <p>$19.99</p>
        <!-- Precio del producto -->

        <button onclick="addToCart('Camiseta Clásica', 19.99)">
        <!-- Botón que llama a JS para agregar producto al carrito -->

          Agregar
        </button>

      </div>

      <div class="product-card">
        <h3>Zapatillas Urbanas</h3>
        <p>$49</p>

        <button onclick="addToCart('Zapatillas Urbanas', 49)">
          Agregar
        </button>
      </div>

      <div class="product-card">
        <h3>Mochila Deportiva</h3>
        <p>$34</p>

        <button onclick="addToCart('Mochila Deportiva', 34)">
          Agregar
        </button>
      </div>

      <div class="product-card">
        <h3>Reloj Digital</h3>
        <p>$59</p>

        <button onclick="addToCart('Reloj Digital', 59)">
          Agregar
        </button>
      </div>

    </div>

    <div class="cart">
    <!-- Sección del carrito -->

      <h2>🛍 Carrito</h2>
      <!-- Título del carrito -->

      <ul id="cart-list"></ul>
      <!-- Lista vacía donde JS insertará productos -->

      <p id="total">Total: $0</p>
      <!-- Muestra el total calculado -->

      <button onclick="openPayment()">
      <!-- Abre el modal de pago -->

        Pagar
      </button>

    </div>

  </div>

  <div id="payment-modal" class="modal">
  <!-- Ventana emergente de pago -->

    <div class="modal-content">
    <!-- Caja del modal -->

      <h3>💳 Pago simulado</h3>
      <!-- Título del pago -->

      <input id="card-number" placeholder="Número tarjeta">
      <!-- Input número de tarjeta -->

      <input id="card-name" placeholder="Titular">
      <!-- Input nombre del titular -->

      <input id="card-exp" placeholder="MM/AA">
      <!-- Fecha de expiración -->

      <input id="card-cvv" placeholder="CVV">
      <!-- Código de seguridad -->

      <button onclick="processPayment()">
      <!-- Botón que procesa el pago -->

        Confirmar pago
      </button>

      <button onclick="closePayment()">
      <!-- Botón para cerrar modal -->

        Cancelar
      </button>

      <p id="payment-status"></p>
      <!-- Mensaje de estado del pago -->

    </div>

  </div>

  <script src="script.js"></script>
  <!-- Conecta la lógica JavaScript -->

</body>
</html>
